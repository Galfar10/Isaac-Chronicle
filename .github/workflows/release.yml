# Push a tag like v0.1.0 to build IsaacCompanion.exe (Windows) and attach the zip to a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/IsaacCompanion-win-x64.zip
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
