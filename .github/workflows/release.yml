# Push a tag like v0.1.0 to build the Companion for Windows, Linux / Steam Deck and macOS
# and attach the archives to a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: IsaacCompanion-win-x64.zip
          - os: ubuntu-22.04 # Steam Deck (SteamOS) and Linux, x64
            asset: IsaacCompanion-linux-x64.tar.gz
          - os: macos-latest # Apple Silicon
            asset: IsaacCompanion-macos-arm64.zip
          - os: macos-15-intel # Intel Macs
            asset: IsaacCompanion-macos-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      # Smoke test: the packaged executable must start and answer on its port.
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          exe=release/IsaacCompanion/isaac-companion
          [ -f release/IsaacCompanion/IsaacCompanion.exe ] && exe=release/IsaacCompanion/IsaacCompanion.exe
          "$exe" --no-open --port 47999 --data-dir "$RUNNER_TEMP/irtc-data" --log "$RUNNER_TEMP/log.txt" &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:47999/ >/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $pid || true
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/${{ matrix.asset }}
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
